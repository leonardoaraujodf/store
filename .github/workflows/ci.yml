name: CI

on:
    push:
    pull_request:

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
        
            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                go-version-file: go.mod
            
            - name: Run checks
              run: make check
            
